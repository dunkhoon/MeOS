<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area 로 하단 제스처바에 하단 탭이 가리지 않게 한다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MeOS</title>
    <!--
      저장해 둔 테마를 화면이 그려지기 전에 입힌다. React 가 돌 때까지 기다리면
      기본 테마가 한 번 번쩍이고 바뀐다. 목록은 lib/theme.ts 와 index.css 에 있고,
      여기서는 값이 멀쩡한지만 확인한다.
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('pp:theme')
          if (!t || !/^[a-z-]{3,24}$/.test(t)) return
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = /light|latte/.test(t) ? 'light' : 'dark'
        } catch (e) {
          /* localStorage 를 못 쓰면 기본 테마로 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
