[functions.sync]
# 앱에서는 로그인한 사용자의 JWT 로, cron/CLI 에서는 service_role 키로 부른다.
# 둘 다 유효한 JWT 라 검증을 켜 둔 채로 동작한다 (익명 호출은 막힌다).
verify_jwt = true

[functions.activity]
verify_jwt = true

[functions.note]
# 사람이 아니라 외부 에이전트가 부른다 — 사용자 JWT 가 없으므로
# 게이트웨이 검증을 끄고 함수 안에서 MEOS_NOTE_TOKEN 을 직접 확인한다.
verify_jwt = false
