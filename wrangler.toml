# Cloudflare Workers — 정적 사이트(Static Assets) 배포 설정.
#
# 이 프로젝트는 Pages 가 아니라 Workers 로 만들어져 있어서 배포가 `wrangler deploy` 로 돈다.
# Workers 에서 정적 파일만 서빙할 때는 아래처럼 [assets] 만 있으면 되고,
# 실행할 스크립트(main)는 필요 없다.
#
# 빌드는 저장소 루트에서 `npm install && npm run build` 로 돌아가고,
# 결과물이 web/dist 에 생긴다.

name = "meos"
compatibility_date = "2026-08-11"

[assets]
directory = "./web/dist"

# 없는 경로는 index.html 로 넘긴다.
# 이 앱은 HashRouter(`/#/tasks`)라 사실 없어도 되지만, 나중에 라우터를 바꿔도 안전하도록 켜 둔다.
not_found_handling = "single-page-application"
